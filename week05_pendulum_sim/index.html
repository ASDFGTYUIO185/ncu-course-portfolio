<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单摆物理模拟器 · 简谐振动</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a24; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center;
    padding: 14px 20px; background: rgba(20, 20, 28, 0.92);
    border-top: 1px solid rgba(90, 200, 250, 0.18);
    color: #b9c6d6; font: 13px/1.4 system-ui, sans-serif;
  }
  #panel label { display: flex; align-items: center; gap: 8px; }
  #panel input[type="range"] { width: 150px; accent-color: #5cc8ff; }
  #panel output { width: 54px; color: #8fd8ff; font-variant-numeric: tabular-nums; }
  #panel button {
    padding: 6px 16px; background: #223042; color: #8fd8ff;
    border: 1px solid rgba(90, 200, 250, 0.35); border-radius: 4px;
    cursor: pointer; font: inherit;
  }
  #panel button:hover { background: #2b3d54; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="panel">
  <label>摆长 <input id="length" type="range" min="100" max="350" step="1" value="200"><output id="length-value"></output></label>
  <label>重力 <input id="gravity" type="range" min="1" max="25" step="0.1" value="9.8"><output id="gravity-value"></output></label>
  <label>阻尼 <input id="damping" type="range" min="0" max="0.01" step="0.001" value="0"><output id="damping-value"></output></label>
  <button id="reset" type="button">重置摆动</button>
</div>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const G_DEFAULT = 9.8;
const LENGTH_DEFAULT = 200;
const PX_PER_M = 200;
const THETA0 = 45 * Math.PI / 180;

let G = G_DEFAULT;
let L_PX = LENGTH_DEFAULT;
let DAMPING = 0;

let theta = THETA0;
let omega = 0;

const DT = 1 / 240;
let accumulator = 0;
let lastTime = performance.now();

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// 半隐式欧拉积分：alpha = -(g / L) * sin(theta)，阻尼按每秒比例衰减角速度
function stepPhysics() {
  const alpha = -(G / (L_PX / PX_PER_M)) * Math.sin(theta);
  omega += alpha * DT;
  omega *= 1 - DAMPING * 30 * DT;
  theta += omega * DT;
}

function draw() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const pivotX = w / 2;
  const pivotY = h * 0.28;
  const bobX = pivotX + L_PX * Math.sin(theta);
  const bobY = pivotY + L_PX * Math.cos(theta);

  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(90, 200, 250, 0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, L_PX, Math.PI / 2 - THETA0 - 0.05, Math.PI / 2 + THETA0 + 0.05);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(180, 210, 235, 0.75)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(bobX, bobY);
  ctx.stroke();

  ctx.fillStyle = '#8fd8ff';
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.shadowColor = 'rgba(80, 190, 255, 0.85)';
  ctx.shadowBlur = 34;

  const glow = ctx.createRadialGradient(bobX - 6, bobY - 6, 2, bobX, bobY, 20);
  glow.addColorStop(0, '#eaf7ff');
  glow.addColorStop(0.45, '#5cc8ff');
  glow.addColorStop(1, '#1b6fa8');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(bobX, bobY, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function frame(now) {
  let elapsed = (now - lastTime) / 1000;
  lastTime = now;
  if (elapsed > 0.1) elapsed = 0.1;

  accumulator += elapsed;
  while (accumulator >= DT) {
    stepPhysics();
    accumulator -= DT;
  }

  draw();
  requestAnimationFrame(frame);
}

function bindSlider(sliderId, outputId, format, apply) {
  const slider = document.getElementById(sliderId);
  const output = document.getElementById(outputId);
  const sync = () => {
    const value = Number(slider.value);
    output.textContent = format(value);
    apply(value);
  };
  slider.addEventListener('input', sync);
  sync();
}

bindSlider('length', 'length-value', v => v + ' px', v => { L_PX = v; });
bindSlider('gravity', 'gravity-value', v => v.toFixed(1), v => { G = v; });
bindSlider('damping', 'damping-value', v => v.toFixed(3), v => { DAMPING = v; });

document.getElementById('reset').addEventListener('click', () => {
  theta = THETA0;
  omega = 0;
});

requestAnimationFrame(frame);
</script>
</body>
</html>
